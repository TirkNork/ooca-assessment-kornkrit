x-app: &app
  build:
    context: .
    target: dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://triage:triage@db:5432/triage
  volumes:
    # Live-mount code and data so changes don't need a rebuild.
    - ./src:/app/src
    - ./scripts:/app/scripts
    - ./tests:/app/tests
    - ./data:/app/data

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-off commands: docker compose run --rm app <command>
  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy

  # HTTP API: docker compose up api  ->  http://localhost:8000/docs
  api:
    <<: *app
    command: ["uvicorn", "triage.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
